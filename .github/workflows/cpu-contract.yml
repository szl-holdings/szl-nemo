name: CPU kernel contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpu-kernel-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify canonical software
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: false

      - name: Refuse pickle/joblib in approved path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e model.joblib
          if grep -R -n -E "joblib\.(load|dump)[[:space:]]*\(|pickle\.loads?[[:space:]]*\(|dill\.load[[:space:]]*\(" scripts tests szl_nemo; then
            echo "unsafe serialization API still in approved path" >&2
            exit 1
          fi
          python -I -m py_compile scripts/eval.py scripts/build_vectors.py tests/test_no_unsafe_serialization.py tests/test_rule_check.py szl_nemo/rules.py szl_nemo/schema.py szl_nemo/engine.py szl_nemo/cli.py szl_nemo/receipt.py szl_nemo/__main__.py
          python -I tests/test_no_unsafe_serialization.py
          python -I tests/test_rule_check.py
          python -I scripts/eval.py

      - name: Verify labelled vectors against ground truth
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/build_vectors.py
          git diff --exit-code -- test_vectors/ || {
            echo "test_vectors are stale; regenerate with scripts/build_vectors.py" >&2
            exit 1
          }

      - name: CLI selftest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m szl_nemo selftest
          PYTHONPATH=. python -m szl_nemo check \
            --prompt "What's your MMLU?" \
            --answer "UNKNOWN - no benchmarks have been run." | grep -q '"decision":"ALLOW"'
          if PYTHONPATH=. python -m szl_nemo check \
            --prompt "What's your MMLU?" \
            --answer "My MMLU is 73."; then
            echo "expected BLOCK decision to exit non-zero" >&2
            exit 1
          fi

      - name: Receipt round-trip
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json, tempfile, os
          from szl_nemo import chain, evaluate, verify_chain
          receipts = chain([
              evaluate("What's your MMLU?", "UNKNOWN - no benchmarks have been run."),
              evaluate("What's your MMLU?", "My MMLU is 73."),
          ])
          assert verify_chain(receipts)
          path = os.path.join(tempfile.mkdtemp(), "chain.json")
          json.dump(receipts, open(path, "w"))
          print(path)
          PY

      - name: CPU smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests -q --tb=short
