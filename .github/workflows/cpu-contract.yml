name: CPU kernel contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpu-kernel-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify canonical software
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: false

      - name: Refuse pickle/joblib in approved path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e model.joblib
          if grep -R -n -E "joblib\.(load|dump)[[:space:]]*\(|pickle\.loads?[[:space:]]*\(|dill\.load[[:space:]]*\(" scripts tests szl_nemo; then
            echo "unsafe serialization API still in approved path" >&2
            exit 1
          fi
          python -I -m py_compile scripts/eval.py tests/test_no_unsafe_serialization.py tests/test_rule_check.py szl_nemo/rules.py
          python -I tests/test_no_unsafe_serialization.py
          python -I tests/test_rule_check.py
          python -I scripts/eval.py

      - name: CPU smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests -q --tb=short
