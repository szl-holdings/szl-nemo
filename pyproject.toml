[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-nemo"
version = "0.4.0"
description = "Deterministic doctrine and proof-carrying inference-envelope witness. Not Nemotron, not an LLM, not a CUDA kernel."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
szl-nemo = "szl_nemo.cli:main"

[tool.setuptools]
packages = ["szl_nemo"]

[tool.setuptools.package-data]
szl_nemo = ["vectors/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
