[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-nemo"
version = "0.3.0"
description = "SOFTWARE/SURROGATE: doctrine rule_check for recipe conformance. Not Nemotron, not an LLM, not a Kernel Hub CUDA kernel."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
szl-nemo = "szl_nemo.cli:main"

[tool.setuptools]
packages = ["szl_nemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
