[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-nemo"
version = "0.4.1"
description = "Deterministic doctrine and proof-carrying inference-envelope witness. Not Nemotron, not an LLM, not a CUDA kernel."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
szl-nemo = "szl_nemo.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-nemo"
Source = "https://github.com/szl-holdings/szl-nemo"
Issues = "https://github.com/szl-holdings/szl-nemo/issues"
Changelog = "https://github.com/szl-holdings/szl-nemo/releases"

[tool.setuptools]
packages = ["szl_nemo"]

[tool.setuptools.package-data]
szl_nemo = ["vectors/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_nemo"] # wheel top-level import names; the release gate fails if the built wheel differs
